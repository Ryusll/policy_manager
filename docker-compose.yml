services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-policy_manager}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      # 컨텍스트가 리포 루트여야 워크스페이스 락파일(package-lock.json)로 재현 설치가 가능하다
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-policy_manager}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 3000
      # Single browser-facing URL → CORS, OAuth redirect, Google callback path (${PUBLIC_URL}/api/auth/google/callback)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      TRUST_PROXY: "1"
      # 데모 계정(admin@demo.com / password123) 생성 여부.
      # 터널·상시 서버 등 외부에서 열리는 배포에서는 반드시 false 로 둔다.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # 개발·통합 테스트용 — 테스트가 회원가입으로 회사를 만든다. 운영(Oracle compose)은 넘기지 않아 닫혀 있다(T-122)
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
      # 통합 테스트가 한 IP 에서 분당 100번 넘게 로그인한다. 운영은 넘기지 않아 기본 100(T-122)
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-1000}
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: policy-files
      # 법제처 국가법령정보 공동활용 OPEN API 인증값. 비우면 연동만 꺼진다(다른 기능 영향 없음).
      # 법제처가 서버 IP·도메인을 이유로 거절하면 법제처에 등록된 서버 IP·도메인을 확인한다.
      LAW_GO_KR_OC: ${LAW_GO_KR_OC:-}
      # T-130 규정 질문(AI). 제공사가 없으면 그 기능만 "설정 안 됨"으로 꺼진다. 질문할 때 관련 조문이 제공사로 간다.
      # AI_QA_PROVIDER: 비우면 ANTHROPIC_API_KEY 가 있을 때 Anthropic, freellmapi 면 무료 제공사 묶음(T-208), mock 은 통합 시험용
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_QA_MODEL: ${AI_QA_MODEL:-}
      AI_QA_MONTHLY_LIMIT: ${AI_QA_MONTHLY_LIMIT:-}
      AI_QA_USER_MONTHLY_LIMIT: ${AI_QA_USER_MONTHLY_LIMIT:-}
      AI_QA_PROVIDER: ${AI_QA_PROVIDER:-}
      AI_QA_BASE_URL: ${AI_QA_BASE_URL:-}
      AI_QA_MODELS: ${AI_QA_MODELS:-}
      AI_QA_ALLOWED_PLATFORMS: ${AI_QA_ALLOWED_PLATFORMS:-}
      # freellmapi 가 뜰 때 쓰는 통합 키(scripts/freellm/freellm-init.mjs) — 아래 freellm_shared 볼륨
      AI_QA_API_KEY_FILE: /run/veda-freellm/unified-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
      - freellm_shared:/run/veda-freellm:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PUBLIC_COMPANY_LEGAL_NAME: ${VITE_PUBLIC_COMPANY_LEGAL_NAME:-}
        VITE_PUBLIC_COMPANY_REG_NO: ${VITE_PUBLIC_COMPANY_REG_NO:-}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  # T-208 규정 질문 무료 제공사 묶음(freellmapi, ADR-0028) — 프로필 ai 로만 뜬다(.env 에 COMPOSE_PROFILES=ai).
  # 허용 제공사(Google·Groq) 키와 관리자 계정은 .env 의 FREELLMAPI_* (.env.example). 버전은 태그+digest 로 고정하고 자동 갱신은 쓰지 않는다.
  # 개발에서는 대시보드 확인용으로 호스트 루프백 3901 에만 연다(운영 구성은 포트를 열지 않는다).
  freellmapi:
    profiles: ["ai"]
    image: ghcr.io/tashfeenahmed/freellmapi:v0.16.23@sha256:845a4b568a20fffd5112e1b9c0258e7782d9eabbba2430612d2f7c811eee267e
    restart: unless-stopped
    entrypoint: ["sh", "/veda/freellm-run.sh"]
    environment:
      PORT: "3001"
      ENCRYPTION_KEY: ${FREELLMAPI_ENCRYPTION_KEY:-}
      FREELLMAPI_ADMIN_EMAIL: ${FREELLMAPI_ADMIN_EMAIL:-}
      FREELLMAPI_ADMIN_PASSWORD: ${FREELLMAPI_ADMIN_PASSWORD:-}
      FREELLMAPI_GOOGLE_KEY: ${FREELLMAPI_GOOGLE_KEY:-}
      FREELLMAPI_GROQ_KEY: ${FREELLMAPI_GROQ_KEY:-}
      FREELLMAPI_ALLOWED_PLATFORMS: ${AI_QA_ALLOWED_PLATFORMS:-}
      FREELLMAPI_UPDATE_CHECK: "off"
      REQUEST_ANALYTICS_LOG_CLIENT: "false"
      RESPONSE_CACHE: "false"
    volumes:
      - freellmapi_data:/app/server/data
      - freellm_shared:/veda-shared
      - ./scripts/freellm:/veda:ro
    ports:
      - "127.0.0.1:3901:3001"
    healthcheck:
      # 서버가 살아 있고 통합 키가 공유 볼륨에 있어야 정상 — 부팅 정책(freellm-init)이 실패하면 배포에서 바로 보이게
      test: ["CMD", "sh", "-c", "test -s /veda-shared/unified-key && node -e \"fetch('http://127.0.0.1:3001/api/ping').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
  api_uploads:
  freellmapi_data:
  freellm_shared:
